x-app: &app
  image: ${PETSHOP_IMAGE:-petshop-api:0.14.0}
  build: .
  environment:
    PETSHOP_ENV: ${PETSHOP_ENV:-production}
    PETSHOP_DATABASE_URL: ${PETSHOP_DATABASE_URL:?Set PETSHOP_DATABASE_URL using hostname postgres}
    PETSHOP_JWT_SECRET: ${PETSHOP_JWT_SECRET:?Set a random PETSHOP_JWT_SECRET of at least 32 bytes}
    PETSHOP_ACCESS_TOKEN_MINUTES: ${PETSHOP_ACCESS_TOKEN_MINUTES:-30}
    PETSHOP_SQL_ECHO: ${PETSHOP_SQL_ECHO:-false}
    PETSHOP_CORS_ORIGINS: ${PETSHOP_CORS_ORIGINS:-}
    PETSHOP_PUBLIC_ORIGIN: ${PETSHOP_PUBLIC_ORIGIN:-}
    PETSHOP_SECURE_COOKIES: ${PETSHOP_SECURE_COOKIES:-false}
    PETSHOP_REVIEW_UPLOAD_DIR: /app/uploads/reviews
    PETSHOP_DOCS_ENABLED: ${PETSHOP_DOCS_ENABLED:-false}
    PETSHOP_LOGIN_MAX_ATTEMPTS: ${PETSHOP_LOGIN_MAX_ATTEMPTS:-5}
    PETSHOP_LOGIN_WINDOW_SECONDS: ${PETSHOP_LOGIN_WINDOW_SECONDS:-300}
    PETSHOP_GEOAPIFY_API_KEY: ${PETSHOP_GEOAPIFY_API_KEY:-}
    PETSHOP_GEOAPIFY_DAILY_LIMIT: ${PETSHOP_GEOAPIFY_DAILY_LIMIT:-2800}
    PETSHOP_PRIVACY_OPERATOR_NAME: ${PETSHOP_PRIVACY_OPERATOR_NAME:-}
    PETSHOP_PRIVACY_OPERATOR_ID: ${PETSHOP_PRIVACY_OPERATOR_ID:-}
    PETSHOP_PRIVACY_CONTACT_EMAIL: ${PETSHOP_PRIVACY_CONTACT_EMAIL:-}
    PETSHOP_PRIVACY_STORAGE_COUNTRY: ${PETSHOP_PRIVACY_STORAGE_COUNTRY:-}
    PETSHOP_PRIVACY_DOCUMENTS_APPROVED: ${PETSHOP_PRIVACY_DOCUMENTS_APPROVED:-false}
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  init: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  uploads-init:
    <<: *app
    user: "0:0"
    network_mode: none
    cap_add:
      - CHOWN
      - FOWNER
    volumes:
      - petshop_review_photos:/app/uploads/reviews
    command: ["/bin/sh", "-ec", "chmod 0755 /app/uploads/reviews && chown 10001:10001 /app/uploads/reviews"]
    healthcheck:
      disable: true
    restart: "no"

  postgres:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-petshop}
      POSTGRES_USER: ${POSTGRES_USER:-petshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a separate PostgreSQL password}
    volumes:
      - petshop_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    <<: *app
    command: ["python", "-m", "app.db.cli", "upgrade"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    volumes:
      - petshop_review_photos:/app/uploads/reviews
    ports:
      - "127.0.0.1:${PETSHOP_HTTP_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      uploads-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  petshop_postgres_data:
  petshop_review_photos:
