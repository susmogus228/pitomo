worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format privacy_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout privacy_safe;
    server_tokens off;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=10s ipv6=off;
    limit_req_zone $binary_remote_addr zone=vets_per_client:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=geo_per_client:10m rate=2r/s;
    map_hash_bucket_size 512;
    map $host $allowed_host { include /tmp/pitomo-host-allowlist.conf; }
    server {
        listen 8080;
        server_name _;
        if ($allowed_host = 0) { return 444; }
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 16m;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        location = /healthz { access_log off; return 200 'ok'; }
        location = /ready {
            access_log off;
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream/ready;
            proxy_set_header Host $http_host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }
        location = /api/v1/vets/nearby {
            limit_req zone=vets_per_client burst=3 nodelay;
            limit_req_status 429;
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }
        location /api/v1/geo/ {
            limit_req zone=geo_per_client burst=5 nodelay;
            limit_req_status 429;
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }
        location = /api/v1/products/with-photos {
            client_max_body_size 32m;
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 5s;
        }
        location /api/ {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }
        location /assets/ { expires 1y; try_files $uri =404; }
        location /media/reviews/ {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream$request_uri;
            proxy_set_header Host $http_host;
            proxy_read_timeout 15s;
            proxy_connect_timeout 5s;
        }
        location ~ "^/media/products/([a-f0-9]{32})\.webp$" {
            alias /srv/pitomo/reviews/products/$1.webp;
            expires -1;
        }
        # Legacy catalog pictures live in the web image, outside the upload volume.
        location /media/products/ { expires -1; try_files $uri =404; }
        location /media/ { expires -1; try_files $uri =404; }
        location /fonts/ { expires 30d; try_files $uri =404; }
        location = /index.html { expires -1; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
